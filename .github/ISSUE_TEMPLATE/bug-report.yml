name: Bug report
description: Report a reproducible MipMapPlus problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MipMapPlus. Search existing issues first and remove private information from logs.
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "26.2"
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: MipMapPlus version
      placeholder: "1.0.0+mc26.2"
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Fabric Loader version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Graphics and mod setup
      description: Include GPU, VRAM, selected mipmap level, filtering, Sodium version, resource pack and resolution, and other rendering mods.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the observed result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the client with ...
        2. Select mipmap level ...
        3. Reload resources ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log
      description: Drag in latest.log or paste the relevant section. Remove tokens, server addresses, chat, and other private information.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private information from the attached logs.
          required: true
        - label: I tested with the smallest practical mod set or listed why I could not.
          required: true
